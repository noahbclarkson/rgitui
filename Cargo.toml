[workspace]
resolver = "2"
members = [
    "crates/rgitui",
    "crates/rgitui_theme",
    "crates/rgitui_ui",
    "crates/rgitui_workspace",
    "crates/rgitui_git",
    "crates/rgitui_graph",
    "crates/rgitui_diff",
    "crates/rgitui_ai",
    "crates/rgitui_settings",
    "crates/rgitui_perf",
    "crates/rgitui_test_support",
]
default-members = ["crates/rgitui"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/noahbclarkson/rgitui"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
# GPUI framework (from Zed repository)
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "24e25552b1259d56a6fdd7956a419ed9e8a1a25e" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "24e25552b1259d56a6fdd7956a419ed9e8a1a25e", features = ["font-kit", "x11", "wayland"] }
http_client = { git = "https://github.com/zed-industries/zed.git", rev = "24e25552b1259d56a6fdd7956a419ed9e8a1a25e" }
reqwest_client = { git = "https://github.com/zed-industries/zed.git", rev = "24e25552b1259d56a6fdd7956a419ed9e8a1a25e" }

# Internal crates
rgitui_theme = { path = "crates/rgitui_theme" }
rgitui_ui = { path = "crates/rgitui_ui" }
rgitui_workspace = { path = "crates/rgitui_workspace" }
rgitui_git = { path = "crates/rgitui_git" }
rgitui_graph = { path = "crates/rgitui_graph" }
rgitui_diff = { path = "crates/rgitui_diff" }
rgitui_ai = { path = "crates/rgitui_ai" }
rgitui_settings = { path = "crates/rgitui_settings" }
rgitui_perf = { path = "crates/rgitui_perf" }
rgitui_test_support = { path = "crates/rgitui_test_support" }

# Core
anyhow = "1"
similar = "2.6"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Comment- and trailing-comma-tolerant JSON for hand-edited config (keymap.json).
# Same crate Zed uses for its keymap and settings files.
serde_json_lenient = "0.2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
smallvec = { version = "1", features = ["union"] }

# Git
#
# All network and authentication work shells out to the `git` CLI (see
# `rgitui_git::project::auth`), so libgit2's own transports are never used.
# Disabling default features drops the transitive libssh2-sys and openssl-sys
# C builds along with their CVE surface.
git2 = { version = "0.20", default-features = false }

# Async
futures = "0.3"
async-channel = "2"
smol = "2"

# FS watching
notify = "8"

# Testing
tempfile = "3.27"

# Utils
same-file = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
md5 = "0.7"
rust-embed = { version = "8", features = ["include-exclude"] }
semver = "1"
urlencoding = "2"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Profile for `rgitui_perf` runs. Debug builds optimise so differently that
# their timings say nothing about the shipped app, so the harness measures a
# release build and only adds back the line tables that profilers, dhat
# backtraces and Tracy need to name a frame.
[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"
