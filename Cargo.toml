[workspace]
resolver = "2"
members = [
    "crates/rgitui",
    "crates/rgitui_theme",
    "crates/rgitui_ui",
    "crates/rgitui_workspace",
    "crates/rgitui_git",
    "crates/rgitui_graph",
    "crates/rgitui_diff",
    "crates/rgitui_ai",
    "crates/rgitui_settings",
    "crates/rgitui_perf",
    "crates/rgitui_test_support",
    "crates/rgitui_i18n",
]
default-members = ["crates/rgitui"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/noahbclarkson/rgitui"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
# GPUI framework (from Zed repository)
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", features = ["font-kit", "x11", "wayland"] }
http_client = { git = "https://github.com/zed-industries/zed.git", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9" }
reqwest_client = { git = "https://github.com/zed-industries/zed.git", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9" }

# Internal crates
rgitui_theme = { path = "crates/rgitui_theme" }
rgitui_ui = { path = "crates/rgitui_ui" }
rgitui_workspace = { path = "crates/rgitui_workspace" }
rgitui_git = { path = "crates/rgitui_git" }
rgitui_graph = { path = "crates/rgitui_graph" }
rgitui_diff = { path = "crates/rgitui_diff" }
rgitui_ai = { path = "crates/rgitui_ai" }
rgitui_settings = { path = "crates/rgitui_settings" }
rgitui_perf = { path = "crates/rgitui_perf" }
rgitui_test_support = { path = "crates/rgitui_test_support" }
rgitui_i18n = { path = "crates/rgitui_i18n" }

# Core
anyhow = "1"
similar = "2.7"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Comment- and trailing-comma-tolerant JSON for hand-edited config (keymap.json).
# Same crate Zed uses for its keymap and settings files.
serde_json_lenient = "0.2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
smallvec = { version = "1", features = ["union"] }

# Git
#
# All network and authentication work shells out to the `git` CLI (see
# `rgitui_git::project::auth`), so libgit2's own transports are never used.
# Disabling default features drops the transitive libssh2-sys and openssl-sys
# C builds along with their CVE surface.
git2 = { version = "0.21", default-features = false }

# Async
futures = "0.3"
async-channel = "2"
smol = "2"

# FS watching
notify = "8"

# Testing
tempfile = "3.27"
# Localization
sys-locale = "0.3.2"

# Utils
same-file = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
md5 = "0.8"
rust-embed = { version = "8", features = ["include-exclude"] }
semver = "1"
urlencoding = "2"

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
incremental = true

# Cargo's default release profile: opt-level 3, no LTO, 16 codegen units. Thin
# LTO with one codegen unit made rebuilding the workspace crates 2.6x slower
# (209s -> 79s locally, more on a 4-core runner) for draw times within run-to-run
# noise of this one — measured on graph-scroll, hover-sweep, scroll-storm and
# startup. Since the graph stopped costing a render pass per row, frame time is
# no longer bound by how tightly the CPU side is compiled.
[profile.release]
opt-level = 3

# Profile for `rgitui_perf` runs. Debug builds optimise so differently that
# their timings say nothing about the shipped app, so the harness measures a
# release build and only adds back the line tables that profilers, dhat
# backtraces and Tracy need to name a frame.
[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"
