[package]
name = "rgitui"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rgitui"
path = "src/main.rs"

[features]
default = []
# Compiles in the performance and memory harness, driven at runtime by the
# `RGITUI_PERF` environment variable. Off by default: the shipped binary carries
# none of this, and a normal build does not even resolve the dependency.
#
# Measure a release-like build — `cargo run --profile perf --features perf` —
# because a debug build's timings describe the debug build and nothing else.
perf = ["dep:rgitui_perf", "rgitui_perf/enabled", "rgitui_workspace/perf"]
# Replaces the global allocator with dhat's to capture allocation sites. Costs
# roughly 100x runtime — a 6-second scenario takes over nine minutes — so
# timings from such a run describe dhat; use it for heap data only. The report
# says so itself rather than relying on you to remember.
perf-dhat = ["perf", "rgitui_perf/dhat-heap"]
# Routes gpui's own draw/present/dispatch instrumentation to Tracy.
perf-tracy = ["perf", "rgitui_perf/tracy"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
rgitui_theme.workspace = true
rgitui_ui.workspace = true
rgitui_workspace.workspace = true
rgitui_git.workspace = true
rgitui_settings.workspace = true
rgitui_ai.workspace = true
rgitui_perf = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
git2.workspace = true
http_client.workspace = true
reqwest_client.workspace = true
rust-embed.workspace = true

[dev-dependencies]
git2.workspace = true
chrono.workspace = true
rgitui_git.workspace = true
rgitui_test_support.workspace = true

[build-dependencies]
winresource = "0.1.31"

[package.metadata.deb]
maintainer = "Noah Clarkson <noah@noahbclarkson.com>"
copyright = "MIT, Noah Clarkson"
license-file = ["../../LICENSE"]
extended-description = "rgitui is a GPU-accelerated Git client built with GPUI, featuring a commit graph, diff viewer, interactive rebase, AI commit messages, and more."
depends = "$auto"
section = "vcs"
priority = "optional"
assets = [
  ["../../target/release/rgitui", "usr/bin/", "755"],
  ["resources/linux/rgitui.desktop", "usr/share/applications/", "644"],
  ["resources/linux/com.rgitui.app.metainfo.xml", "usr/share/metainfo/", "644"],
  ["../../assets/icons/app-icon-16.png",  "usr/share/icons/hicolor/16x16/apps/rgitui.png",   "644"],
  ["../../assets/icons/app-icon-32.png",  "usr/share/icons/hicolor/32x32/apps/rgitui.png",   "644"],
  ["../../assets/icons/app-icon-48.png",  "usr/share/icons/hicolor/48x48/apps/rgitui.png",   "644"],
  ["../../assets/icons/app-icon-256.png", "usr/share/icons/hicolor/256x256/apps/rgitui.png", "644"],
  ["../../assets/icons/app-icon-512.png", "usr/share/icons/hicolor/512x512/apps/rgitui.png", "644"],
  ["../../assets/icons/app-icon.svg",     "usr/share/icons/hicolor/scalable/apps/rgitui.svg", "644"],
]
