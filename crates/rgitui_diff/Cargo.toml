[package]
name = "rgitui_diff"
version = "0.3.2"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
similar.workspace = true
gpui.workspace = true
rgitui_theme.workspace = true
rgitui_ui.workspace = true
rgitui_git.workspace = true
rgitui_settings.workspace = true
anyhow.workspace = true
log.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
# `test-support` unlocks gpui's headless test harness (TestApp, TestAppWindow,
# keystroke/mouse simulation). Test builds only; normal builds are unaffected.
gpui = { workspace = true, features = ["test-support"] }
rgitui_test_support.workspace = true
