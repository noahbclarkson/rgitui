[package]
name = "rgitui_diff"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
similar.workspace = true
gpui.workspace = true
rgitui_theme.workspace = true
rgitui_ui.workspace = true
rgitui_git.workspace = true
rgitui_settings.workspace = true
anyhow.workspace = true
# Only for parsing a hex OID out of a `DiffSource` when building the tree pair
# an apply/revert patch comes from.
git2.workspace = true
log.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rgitui_perf = { workspace = true, optional = true }

[dev-dependencies]
# `test-support` unlocks gpui's headless test harness (TestApp, TestAppWindow,
# keystroke/mouse simulation). Test builds only; normal builds are unaffected.
gpui = { workspace = true, features = ["test-support"] }
rgitui_test_support.workspace = true

[features]
default = []
# See `rgitui_git`'s `perf` feature. Propagated so the census can walk the
# `FileDiff`s this crate renders as well as the rows it derives from them.
perf = ["dep:rgitui_perf", "rgitui_git/perf"]
