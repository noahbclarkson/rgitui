[package]
name = "rgitui_git"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
git2.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
parking_lot.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
smol.workspace = true
rgitui_settings.workspace = true
tempfile.workspace = true
rgitui_perf = { workspace = true, optional = true }

[dev-dependencies]
rgitui_test_support.workspace = true

[features]
default = []
# Enables the `HeapSize` impls the perf harness walks. Off by default, so a
# normal build does not carry the dependency at all.
perf = ["dep:rgitui_perf"]
